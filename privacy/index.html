<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy – Accenta</title>
    <link rel="icon" type="image/png" sizes="32x32" href="websitefavicon.png">
    <link rel="shortcut icon" href="websitefavicon.png">
    <link rel="apple-touch-icon" href="websiteLogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-one: rgb(51, 204, 191);      /* Bright cyan-blue */
            --color-two: rgb(38, 166, 153);      /* Medium teal-green */
            --color-three: rgb(26, 140, 128);    /* Darker teal-green */
            --color-four: rgb(20, 115, 107);     /* Deep teal */
            --bg-light: rgb(230, 244, 241);      /* Light background */
            --bg-white: #FFFFFF;
            --text-dark: #0F2B27;
            --text-muted: #4A7C72;
            --gradient-1: linear-gradient(135deg, var(--color-one) 0%, var(--color-two) 100%);
            --gradient-2: linear-gradient(135deg, var(--color-two) 0%, var(--color-three) 100%);
            --gradient-3: linear-gradient(135deg, var(--color-three) 0%, var(--color-four) 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Animated background */
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: var(--color-one);
            top: -200px;
            left: -200px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: var(--color-three);
            bottom: -150px;
            right: -150px;
            animation-delay: 5s;
        }

        .orb-3 {
            width: 350px;
            height: 350px;
            background: var(--color-two);
            top: 50%;
            right: 10%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(50px, -50px) scale(1.1); }
            50% { transform: translate(-30px, 30px) scale(0.9); }
            75% { transform: translate(30px, 50px) scale(1.05); }
        }

        /* Navigation */
        nav {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .logo span {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 2rem;
            font-weight: 800;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            object-fit: cover;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: var(--text-dark);
        }

        /* Content Section */
        .content-section {
            padding: 4rem 4rem 8rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .content-header {
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .content-header h1 {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .effective-date {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .content-body {
            background: var(--bg-white);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 4px 20px rgba(26, 140, 128, 0.08);
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .content-body h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            color: var(--color-three);
        }

        .content-body h2:first-child {
            margin-top: 0;
        }

        .content-body p {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 1.5rem;
            color: var(--text-dark);
        }

        .content-body a {
            color: var(--color-two);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .content-body a:hover {
            color: var(--color-one);
            text-decoration: underline;
        }

        /* Footer */
        footer {
            padding: 3rem 4rem;
            border-top: 1px solid rgba(26, 140, 128, 0.15);
            text-align: center;
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 2rem;
        }

        .footer-links {
            display: flex;
            gap: 2rem;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: var(--text-dark);
        }

        .footer-copyright {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s, opacity 0.3s;
        }

        .social-links a:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        .social-links img {
            width: 32px;
            height: 32px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            nav {
                padding: 1.5rem 2rem;
            }

            .content-section {
                padding: 2rem 2rem 4rem;
            }

            .content-header h1 {
                font-size: 2.5rem;
            }

            .content-body {
                padding: 2rem;
            }

            .content-body h2 {
                font-size: 1.5rem;
            }

            .content-body p {
                font-size: 1rem;
            }

            .footer-content {
                flex-direction: column;
                text-align: center;
            }
</head>
<body>
    <div class="background-animation">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <nav>
        <a href="../" class="logo">
            <img src="../websiteLogo.png" alt="Accenta Logo" class="logo-icon">
            <span>Accenta</span>
        </a>
        <a href="../" class="nav-link">Back to Home</a>
    </nav>

    <section class="content-section">
        <div class="content-header">
            <h1>Privacy Policy</h1>
            <p class="effective-date">Effective Date: January 30, 2026</p>
        </div>

        <div class="content-body">
            <p>Welcome to Accenta. This Privacy Policy explains how we collect, use, and protect your information when you use the Accenta mobile application (the "App"). By using the App, you agree to the practices described in this policy.</p>

            <h2>1. Information We Collect</h2>
            <p>Accenta is designed with privacy in mind. The App processes your voice recordings locally on your device to identify your English accent. We collect minimal data to provide and improve our services:</p>
            <p><strong>Voice Data:</strong> Audio recordings are processed in real-time for accent analysis. Voice data is not stored on our servers unless you explicitly opt in to help improve our AI models.</p>
            <p><strong>Usage Data:</strong> We may collect anonymous usage statistics such as app opens, features used, and crash reports to improve the App's performance and user experience.</p>
            <p><strong>Device Information:</strong> Basic device information (device model, operating system version) may be collected for compatibility and troubleshooting purposes.</p>

            <h2>2. How We Use Your Information</h2>
            <p>We use the information we collect to: provide and maintain the accent identification service; improve and optimize the App's AI accuracy and performance; diagnose technical issues and prevent errors; communicate important updates about the App.</p>

            <h2>3. Data Storage and Security</h2>
            <p>Accenta prioritizes your privacy. Voice recordings are processed on-device and are not transmitted to external servers during standard use. Any data that is collected is protected using industry-standard encryption and security measures. We retain collected data only for as long as necessary to fulfill the purposes outlined in this policy.</p>

            <h2>4. Third-Party Services</h2>
            <p>The App may use third-party services for analytics, AI processing, or other functionality. These services may collect information according to their own privacy policies. Third-party services we may use include: Apple App Store services, Firebase (Google) for backend infrastructure, and AI processing APIs for accent analysis. We encourage you to review the privacy policies of these third-party services.</p>

            <h2>5. Data Sharing</h2>
            <p>We do not sell, trade, or rent your personal information to third parties. We may share anonymized, aggregated data that cannot identify individual users for research or analytical purposes. We may disclose information if required by law or to protect the rights, property, or safety of Accenta, our users, or the public.</p>

            <h2>6. Children's Privacy</h2>
            <p>Accenta is not intended for children under the age of 13. We do not knowingly collect personal information from children under 13. If we become aware that we have inadvertently collected personal information from a child under 13, we will take steps to delete such information promptly.</p>

            <h2>7. Your Rights</h2>
            <p>Depending on your jurisdiction, you may have the following rights regarding your personal data: the right to access the personal data we hold about you; the right to request correction of inaccurate data; the right to request deletion of your data; the right to withdraw consent for data processing; the right to data portability. To exercise any of these rights, please contact us using the information provided below.</p>

            <h2>8. International Data Transfers</h2>
            <p>If you are accessing the App from outside the jurisdiction where our servers are located, your information may be transferred to, stored, and processed in a different country. By using the App, you consent to such transfers. We ensure that appropriate safeguards are in place to protect your data in accordance with this Privacy Policy.</p>

            <h2>9. Cookies and Tracking</h2>
            <p>The App does not use cookies. However, third-party services integrated into the App may use similar technologies. You can control these through your device settings.</p>

            <h2>10. Changes to This Privacy Policy</h2>
            <p>We may update this Privacy Policy from time to time. We will notify you of any changes by posting the new Privacy Policy within the App and updating the "Effective Date" at the top. Your continued use of the App after changes are posted constitutes your acceptance of the revised policy.</p>

            <h2>11. Contact Information</h2>
            <p>If you have any questions, concerns, or requests regarding this Privacy Policy or our data practices, please contact us via the contact button on our website at <a href="https://accenta.io">accenta.io</a>.</p>

            <p style="margin-top: 2.5rem; padding-top: 2rem; border-top: 1px solid rgba(26, 140, 128, 0.15); font-style: italic; color: var(--text-muted);">By using Accenta, you acknowledge that you have read and understood the practices described in this Privacy Policy.</p>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <div class="footer-copyright">
                © 2026 Accenta. All rights reserved.
            </div>
            <div class="social-links">
                <a href="https://www.instagram.com/accentaio/" target="_blank" rel="noopener noreferrer">

                <a href="../terms/">Terms & Conditions</a>

</body>
</html>
