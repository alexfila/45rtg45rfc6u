name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Copy built files to repo root so GitHub Pages (main branch) serves them
      - name: Commit built files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp -r dist/assets .
          cp dist/index.html index.html
          git add index.html assets/
          git diff --cached --quiet || git commit -m "ci: deploy built assets [skip ci]"
          git push
